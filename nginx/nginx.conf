# ================================================================
# Nginx Configuration for Employee Management System
# ================================================================

events {
    worker_connections 1024;  # max simultaneous connections
}

http {

    # ============================================================
    # Logging format
    # ============================================================
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ============================================================
    # Performance settings
    # ============================================================
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ============================================================
    # Upstream: defines where to forward requests
    # 'app' is the Docker service name — Nginx resolves it
    # automatically within the Docker network
    # ============================================================
    upstream employee_app {
        server app:8083;   # 'app' = service name in docker-compose
    }

    # ============================================================
    # Server block: listens on port 80
    # ============================================================
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";

        # --------------------------------------------------------
        # Main location: forward ALL requests to Spring Boot app
        # --------------------------------------------------------
        location / {
            proxy_pass http://employee_app;

            # Pass real client IP to app
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_read_timeout    60s;
        }

        # --------------------------------------------------------
        # Health check endpoint for Nginx itself
        # --------------------------------------------------------
        location /nginx-health {
            access_log off;
            return 200 "nginx is healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
