# ================================================================
# CI Pipeline — Employee Management System
# Trigger: Every Pull Request to 'develop' or 'main'
# Purpose: Build → Test → Security Scan → Docker Build
# ================================================================

name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop  # Also run on direct pushes to develop

# Cancel in-progress runs if a new push comes in
# Saves GitHub Actions minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==============================================================
  # JOB: CI Pipeline
  # All steps run sequentially on one Ubuntu machine
  # ==============================================================
  ci-pipeline:
    name: Build, Test & Scan
    runs-on: ubuntu-latest  # GitHub provides this machine for free

    # ----------------------------------------------------------
    # Service containers — spin up PostgreSQL for tests
    # This is a real DB running alongside our job
    # ----------------------------------------------------------
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       employee_db
          POSTGRES_USER:     admin
          POSTGRES_PASSWORD: admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # --------------------------------------------------------
      # STEP 1: Checkout
      # Downloads your repository code onto the runner machine
      # --------------------------------------------------------
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # STEP 2: Set up Java 21
      # Installs Java on the runner machine
      # --------------------------------------------------------
      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'  # Eclipse Temurin = same as our Docker image

      # --------------------------------------------------------
      # STEP 3: Cache Maven Dependencies
      # Saves downloaded JARs between runs
      # Without this: downloads 200MB every run (~2 min)
      # With this: uses cache after first run (~10 seconds)
      # --------------------------------------------------------
      - name: 📦 Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('app/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # --------------------------------------------------------
      # STEP 4: Build
      # Compiles code and packages into JAR
      # --------------------------------------------------------
      - name: 🔨 Build Application
        working-directory: app
        run: mvn clean package -DskipTests -B
        # -B = batch mode (no interactive prompts, cleaner logs)

      # --------------------------------------------------------
      # STEP 5: Run Unit Tests
      # Runs all tests — fails job if any test fails
      # --------------------------------------------------------
      - name: 🧪 Run Unit Tests
        working-directory: app
        run: mvn test -B
        env:
          # These override application.properties for CI
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/employee_db
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin123

      # --------------------------------------------------------
      # STEP 6: Publish Test Results
      # Shows test results directly in GitHub PR interface
      # --------------------------------------------------------
      - name: 📊 Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()  # Run even if tests failed
        with:
          files: app/target/surefire-reports/*.xml

      # --------------------------------------------------------
      # STEP 7: Checkstyle
      # Enforces code style — fails if style violations found
      # --------------------------------------------------------
      - name: 🎨 Checkstyle
        working-directory: app
        run: mvn checkstyle:check -B
        continue-on-error: true  # Don't fail build for style issues yet

      # --------------------------------------------------------
      # STEP 8: Trivy - Scan Filesystem
      # Scans your source code and dependencies for CVEs
      # --------------------------------------------------------
      - name: 🔒 Trivy Scan - Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail build on findings (informational for now)

      # --------------------------------------------------------
      # STEP 9: Build Docker Image
      # Builds the image to verify Dockerfile works
      # --------------------------------------------------------
      - name: 🐳 Build Docker Image
        working-directory: app
        run: |
          docker build -t employee-app:${{ github.sha }} .
          docker build -t employee-app:latest .

      # --------------------------------------------------------
      # STEP 10: Trivy - Scan Docker Image
      # Scans the built image for vulnerabilities
      # --------------------------------------------------------
      - name: 🔒 Trivy Scan - Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'employee-app:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # --------------------------------------------------------
      # STEP 11: Upload JAR as Artifact
      # Saves the built JAR so other jobs/workflows can use it
      # --------------------------------------------------------
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-jar-${{ github.sha }}
          path: app/target/*.jar
          retention-days: 7
