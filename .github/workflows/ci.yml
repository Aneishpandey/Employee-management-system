name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents:      read
  checks:        write
  pull-requests: write

jobs:

  # ============================================================
  # JOB 1: CI — Build, Test, Scan
  # ============================================================
  ci-pipeline:
    name: Build, Test & Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       employee_db
          POSTGRES_USER:     admin
          POSTGRES_PASSWORD: admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('app/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🔨 Build Application
        working-directory: app
        run: mvn clean package -DskipTests -B

      - name: 🧪 Run Unit Tests
        working-directory: app
        run: mvn test -B
        env:
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/employee_db
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin123

      - name: 📊 Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: app/target/surefire-reports/*.xml

      - name: 🎨 Checkstyle
        working-directory: app
        run: mvn checkstyle:check -B
        continue-on-error: true

      - name: 🔒 Trivy Scan - Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 🐳 Build Docker Image
        working-directory: app
        run: docker build -t employee-app:${{ github.sha }} .

      - name: 🔒 Trivy Scan - Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: employee-app:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-jar-${{ github.sha }}
          path: app/target/*.jar
          retention-days: 7

  # ============================================================
  # JOB 2: Push to ECR
  # Only runs on push to develop (not PRs)
  # ============================================================
  push-to-ecr:
    name: Push Image to ECR
    runs-on: ubuntu-latest
    needs: ci-pipeline
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    outputs:
      image-tag: ${{ steps.build-push.outputs.image-tag }}

    steps:

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build and Push to ECR
        id: build-push
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_DEV }}
          IMAGE_TAG:      ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./app

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ============================================================
  # JOB 3: Deploy to DEV
  # Only runs after successful ECR push
  # ============================================================
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: push-to-ecr
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    environment:
      name: development
      url: http://65.2.140.189

    steps:

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          timeout:     120s
          script: |
            # Set PATH explicitly (important for finding aws, docker)
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin

            echo "=== Starting DEV Deployment ==="
            echo "Server: $(hostname)"
            echo "Time:   $(date)"

            # Read secrets from SSM
            DB_PASSWORD=$(aws ssm get-parameter \
                --name "/employee/prod/db/password" \
                --with-decryption \
                --region ap-south-1 \
                --query 'Parameter.Value' \
                --output text)

            DB_USERNAME=$(aws ssm get-parameter \
                --name "/employee/prod/db/username" \
                --region ap-south-1 \
                --query 'Parameter.Value' \
                --output text)

            DB_URL=$(aws ssm get-parameter \
                --name "/employee/prod/db/url" \
                --region ap-south-1 \
                --query 'Parameter.Value' \
                --output text)

            # Login to ECR
            aws ecr get-login-password --region ap-south-1 | \
                docker login \
                --username AWS \
                --password-stdin \
                208549351005.dkr.ecr.ap-south-1.amazonaws.com

            # Pull latest image
            docker pull 208549351005.dkr.ecr.ap-south-1.amazonaws.com/employee-app-dev:latest

            # Stop old container
            docker stop employee_app 2>/dev/null || true
            docker rm   employee_app 2>/dev/null || true

            # Start new container
            docker run -d \
                --name employee_app \
                --restart unless-stopped \
                -p 8083:8083 \
                -e SPRING_DATASOURCE_URL=$DB_URL \
                -e SPRING_DATASOURCE_USERNAME=$DB_USERNAME \
                -e SPRING_DATASOURCE_PASSWORD=$DB_PASSWORD \
                -e SERVER_PORT=8083 \
                208549351005.dkr.ecr.ap-south-1.amazonaws.com/employee-app-dev:latest

            # Health check
            echo "Waiting for app to start..."
            for i in $(seq 1 12); do
                HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                    http://localhost:8083/actuator/health 2>/dev/null || echo "000")
                if [ "$HTTP" = "200" ]; then
                    echo "App is healthy! ✅"
                    break
                fi
                if [ $i -eq 12 ]; then
                    echo "ERROR: Health check failed!"
                    docker logs --tail 30 employee_app
                    exit 1
                fi
                echo "Attempt $i/12 (HTTP $HTTP) waiting 10s..."
                sleep 10
            done

            echo "=== DEV Deployment Complete! ==="
            echo "URL: http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"
            docker ps | grep employee
