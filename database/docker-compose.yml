
# ================================================================
# DATABASE STACK — PostgreSQL only
# Purpose: Run PostgreSQL locally for development
# Usage:   docker compose -f database/docker-compose.yml up -d
# ================================================================

services:

  postgres:
    image: postgres:16                    # Official PostgreSQL 16 image
    container_name: employee_postgres     # Name we'll use to reference this container
    restart: unless-stopped               # Auto-restart if it crashes

    environment:
      POSTGRES_DB: employee_db            # Database name to create on startup
      POSTGRES_USER: admin                # Database superuser
      POSTGRES_PASSWORD: admin123         # Password (local dev only - never in prod!)

    ports:
      - "5433:5432"                       # host_port:container_port
                                          # Your app connects to localhost:5432
                                          # Docker forwards it to container's 5432

    volumes:
      - postgres_data:/var/lib/postgresql/data   # Persist data even if container restarts
      - ./init:/docker-entrypoint-initdb.d       # SQL files here run on first startup

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d employee_db"]
      interval: 10s      # Check every 10 seconds
      timeout: 5s        # Fail if no response in 5 seconds
      retries: 5         # Try 5 times before marking unhealthy

# ================================================================
# VOLUMES — Named volumes persist data outside containers
# Without this, all data is lost when container is removed
# ================================================================
volumes:
  postgres_data:
    driver: local
