# ================================================================
# Employee Management System — Full Stack
# Services: postgres + app + nginx
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Logs:    docker compose logs -f
#   Rebuild: docker compose up -d --build
# ================================================================

services:

  # ==============================================================
  # SERVICE 1: PostgreSQL Database
  # ==============================================================
  postgres:
    image: postgres:16
    container_name: employee_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB:       employee_db
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin123

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ems-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d employee_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================================================
  # SERVICE 2: Spring Boot Application
  # ==============================================================
  app:
    build:
      context: ./app        # where Dockerfile is
      dockerfile: Dockerfile
    container_name: employee_app
    restart: unless-stopped

    environment:
      # Override application.properties values at runtime
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/employee_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8083

    ports:
      - "8083:8083"   # Direct access for development/debugging

    networks:
      - ems-network

    depends_on:
      postgres:
        condition: service_healthy   # Wait for postgres healthcheck ✅

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==============================================================
  # SERVICE 3: Nginx Reverse Proxy
  # ==============================================================
  nginx:
    image: nginx:alpine
    container_name: employee_nginx
    restart: unless-stopped

    ports:
      - "80:80"       # Public port — access app via http://localhost

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # ro = read-only

    networks:
      - ems-network

    depends_on:
      app:
        condition: service_healthy   # Wait for app healthcheck ✅

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

# ================================================================
# NETWORKS
# All services on same network = can reach each other by name
# ================================================================
networks:
  ems-network:
    driver: bridge

# ================================================================
# VOLUMES
# Named volumes persist data outside containers
# ================================================================
volumes:
  postgres_data:
    driver: local
